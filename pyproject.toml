[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Library-Guides-LTI"
dynamic = ["version"]
description = "An LTI app for displaying UW Library Subject Guides in Canvas"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "UWIT Student & Educational Technology Services", email = "aca-it@uw.edu"}
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dependencies = [
    "django~=5.2",
    "django-blti~=3.0",
    "django-compressor",
    "uw-memcached-clients~=1.0",
    "uw-restclients-core~=1.4",
    "uw-restclients-libraries~=1.0",
    "uw-restclients-canvas~=1.2",
]

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools]
packages = ["libguide"]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "libguide/VERSION"}

[tool.ruff]
line-length = 88
exclude = [
]

[tool.ruff.lint]
ignore = [
]

[tool.coverage.run]
source = ["library-guides-lti"]
parallel = true
omit = [
     "libguide/tests.py"
]

[tool.coverage.paths]
source = [
    "libguide/",
    "/app/libguide/",
]
